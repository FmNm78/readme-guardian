name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # --strict would also fail the build on warning-level rules
      # (codeowners-exists, branch-protection-exists, funding-exists),
      # which this repo hasn't configured on purpose. --strict fits repos
      # with full governance config in place; this CI only blocks on
      # error-level rule failures.
      - name: Run readme-guardian check
        run: node dist/index.js check .
